<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" width="260" height="190" role="img" aria-labelledby="t">
  <title id="t">A head-fixed C57BL/6 mouse sniffs odor puffs and licks water from a spout while a Neuropixels probe in its prefrontal cortex records spikes</title>
  <style>
    .frame{fill:#0e1727;stroke:#27344b}
    .cap{font:700 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#a8c2ec}
    .sub{font:400 10.5px ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#8b95a7}
    .fur{fill:#2c3038;stroke:#77829a;stroke-width:1.4;stroke-linejoin:round}
    .pink{fill:#ef9aa6}
    .gear{fill:none;stroke:#8b95a7;stroke-linecap:round;stroke-linejoin:round}
    .slate{fill:#4f5d74;stroke:#8b95a7;stroke-width:1.2;stroke-linejoin:round}
    .a{animation-iteration-count:infinite;animation-fill-mode:both}
    .fb{transform-box:fill-box;transform-origin:center}
    #tail{transform-origin:63px 122px;animation:sway 3.2s ease-in-out infinite alternate}
    .wh{fill:none;stroke:#a3acbd;stroke-width:.8;stroke-linecap:round;transform-origin:174px 107px;animation:whisk .45s ease-in-out infinite alternate}
    .snout{animation:sniff 4s linear infinite}
    .puff{opacity:0;animation:puff 8s linear infinite both}
    .spk{fill:#f39c12;opacity:0;animation:spike 4s linear infinite both}
    .tip{opacity:0;animation:tipflash 4s linear infinite both}
    .drop{fill:#7fb6ec;transform-box:fill-box;transform-origin:50% 0;animation:drop 4s linear infinite both}
    .tongue{transform-box:fill-box;transform-origin:0 0;opacity:0;animation:lick 4s linear infinite both}
    @keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
    @keyframes whisk{from{transform:rotate(-6deg)}to{transform:rotate(5deg)}}
    @keyframes sniff{0%,18%{transform:none}20%{transform:translateX(.9px)}22%{transform:none}24%{transform:translateX(.9px)}26%{transform:none}28%{transform:translateX(.9px)}30%,100%{transform:none}}
    @keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.35)}2%{opacity:.95}11%{opacity:.8}14%{opacity:0;transform:translate(-19px,1px) scale(1.3)}100%{opacity:0;transform:translate(-19px,1px) scale(1.3)}}
    @keyframes spike{0%,25%{opacity:0;transform:translateY(0)}27%{opacity:1}43%{opacity:1;transform:translateY(-60px)}45%,100%{opacity:0;transform:translateY(-60px)}}
    @keyframes tipflash{0%,24%{opacity:0}27%{opacity:1}38%,100%{opacity:0}}
    @keyframes drop{0%,34%{transform:scale(0)}40%,57%{transform:scale(1)}59%,100%{transform:scale(0)}}
    @keyframes lick{0%,45%{opacity:0;transform:scale(.25)}47%{opacity:1;transform:scale(1)}50%{opacity:0;transform:scale(.25)}52%{opacity:1;transform:scale(1)}55%{opacity:0;transform:scale(.25)}57%{opacity:1;transform:scale(1)}60%,100%{opacity:0;transform:scale(.25)}}
    @media (prefers-reduced-motion: reduce){.a{animation:none!important}.still{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="259" height="189" rx="12"/>
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd36e"/><stop offset=".4" stop-color="#f2a929" stop-opacity=".85"/><stop offset="1" stop-color="#f2a929" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- platform, odor port, lick spout -->
  <path class="gear" stroke-width="2" d="M34 135.5H180"/>
  <path class="gear" stroke-width="3" d="M243 104H258M247 151L191 119.5"/>
  <rect class="slate" x="212" y="93" width="31" height="22" rx="4"/>
  <path class="slate" d="M212 98.5L200 101.8V106.2L212 109.5Z"/>
  <circle cx="236" cy="99" r="1.8" fill="#f2a929"/>
  <circle class="a puff fb still" cx="198" cy="104" r="3.8" fill="#f2a929" style="animation-delay:0.00s"/>
  <circle class="a puff fb" cx="198" cy="100.6" r="3" fill="#f2a929" style="animation-delay:0.16s"/>
  <circle class="a puff fb" cx="198" cy="107.4" r="3" fill="#f2a929" style="animation-delay:0.32s"/>
  <circle class="a puff fb" cx="198" cy="104" r="3.8" fill="#a08cf0" style="animation-delay:4.00s"/>
  <circle class="a puff fb" cx="198" cy="100.6" r="3" fill="#a08cf0" style="animation-delay:4.16s"/>
  <circle class="a puff fb" cx="198" cy="107.4" r="3" fill="#a08cf0" style="animation-delay:4.32s"/>
  <!-- tail, body, legs -->
  <path class="a" id="tail" d="M63 122C50 126 40 131 30 133C20 135 14 131 13 124" fill="none" stroke="#c08f98" stroke-width="3.4" stroke-linecap="round"/>
  <path class="fur" d="M62 121C58 101 72 83 98 79C118 76 134 79 146 87C158 93 170 99 178 105C181 107 181 110 178 111.5C171 113.5 162 115.5 154 116.5C146 124 132 130 112 131.5C90 132.5 70 130 62 121Z"/>
  <path d="M71 124C72 112 84 105 97 109" fill="none" stroke="#77829a" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="104" cy="90" rx="26" ry="7" transform="rotate(-12 104 90)" fill="#fff" opacity=".07"/>
  <path class="fur" d="M143 117C146 124 148 128 150 131.5H157C156 125 155 120 153 114Z"/>
  <ellipse class="pink" cx="154.5" cy="132.5" rx="4.6" ry="2.2"/>
  <ellipse class="pink" cx="80" cy="133.6" rx="8.5" ry="2.4"/>
  <!-- ear, eye -->
  <ellipse class="fur" cx="134" cy="78" rx="12" ry="14" transform="rotate(-15 134 78)"/>
  <ellipse class="pink" cx="134.6" cy="79" rx="6.8" ry="9" transform="rotate(-15 134.6 79)"/>
  <circle cx="161" cy="96.5" r="3.3" fill="#0b0d10"/>
  <circle cx="162.2" cy="95.3" r="1.1" fill="#fff"/>
  <!-- snout: nose, whiskers, tongue -->
  <g class="a snout">
    <path class="a tongue" d="M174 112.5C179 114.5 184 117.5 187.5 121.5C183 121.5 178 118.5 173 115.5Z" fill="#ef9aa6"/>
    <ellipse class="pink" cx="179.3" cy="106.8" rx="3" ry="2.6"/>
    <path d="M176 110.5Q173.5 112.5 170.5 112" fill="none" stroke="#77829a" stroke-width="1" stroke-linecap="round"/>
    <g class="a wh"><path d="M174 104.5L198 96.5M175 106.5L200.5 104.5M175 108.5L199.5 112.5M174 109.5L195 119.5"/></g>
  </g>
  <circle class="a drop still" cx="189.6" cy="123.2" r="3"/>
  <!-- implant cap and Neuropixels probe -->
  <ellipse cx="152" cy="87.5" rx="9.5" ry="3.6" fill="#9aa3b5"/>
  <path d="M159 21C172 19 182 11 197 4" fill="none" stroke="#3d85d1" stroke-width="3" stroke-linecap="round"/>
  <rect x="145" y="15" width="14" height="20" rx="2" fill="#3d85d1"/>
  <path d="M152 35V104" stroke="#3d85d1" stroke-width="2" stroke-linecap="round"/>
  <circle class="a tip" cx="152" cy="101" r="7" fill="url(#glow)"/>
  <circle class="a spk" cx="152" cy="100" r="2.5"/>
  <circle class="a spk" cx="152" cy="100" r="2.5" style="animation-delay:.22s"/>
  <circle class="a spk" cx="152" cy="100" r="2.5" style="animation-delay:.44s"/>
  <text class="cap" x="16" y="164">1 · LEARN</text>
  <text class="sub" x="16" y="179">Adjacent odor pairs, head-fixed</text>
</svg>
