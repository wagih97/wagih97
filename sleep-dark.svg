  <g transform="translate(0 -9)">
  <!-- bedding and tail -->
  <path d="M34 157C64 153 94 159 124 155C154 151 184 157 224 154" fill="none" stroke="#8b95a7" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M71 141C59 150 70 156 97 156C121 156 141 154 155 150" fill="none" stroke="#c08f98" stroke-width="3.2" stroke-linecap="round"/>
  <!-- curled C57BL/6, breathing -->
