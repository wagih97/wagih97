<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 190" width="260" height="190" role="img" aria-labelledby="t">
  <title id="t">The C57BL/6 mouse sleeps curled up, breathing slowly, while a raster of prefrontal neurons replays a firing sequence</title>
  <style>
    .frame{fill:#0e1727;stroke:#27344b}
    .cap{font:700 12px ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#a8c2ec}
    .sub{font:400 10.5px ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#8b95a7}
    .fur{fill:#2c3038;stroke:#77829a;stroke-width:1.4;stroke-linejoin:round}
    .pink{fill:#ef9aa6}
    .gear{fill:none;stroke:#8b95a7;stroke-linecap:round;stroke-linejoin:round}
    .slate{fill:#4f5d74;stroke:#8b95a7;stroke-width:1.2;stroke-linejoin:round}
    .a{animation-iteration-count:infinite;animation-fill-mode:both}
    .fb{transform-box:fill-box;transform-origin:center}
    .scroll{animation:scroll 9s linear infinite}
    .breathe{transform-origin:116px 150px;animation:breathe 3.4s ease-in-out infinite alternate}
    .z{font:700 13px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#a8c2ec;opacity:0;animation:z 3.6s ease-out infinite both}
    .lbl{font:600 9px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:1px;fill:#8b95a7}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-216px)}}
    @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.025,1.04)}}
    @keyframes z{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(5px,-12px)}}
    @media (prefers-reduced-motion: reduce){.a{animation:none!important}.still{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  </style>
  <rect class="frame" x=".5" y=".5" width="259" height="189" rx="12"/>
  <clipPath id="win"><rect x="22" y="18" width="216" height="48"/></clipPath>
  <text class="lbl" x="22" y="13">mPFC</text>
  <path d="M22 70H238" stroke="#8b95a7" stroke-opacity=".35"/>
