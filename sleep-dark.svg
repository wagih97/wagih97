  </g>
  <text class="a z still" x="174" y="106">z</text>
  <text class="a z" x="186" y="94" style="font-size:15px;animation-delay:1.2s">z</text>
  <text class="a z" x="200" y="81" style="font-size:18px;animation-delay:2.4s">Z</text>
  <text class="cap" x="16" y="164">2 · SLEEP</text>
  <text class="sub" x="16" y="179">Offline processing after learning</text>
</svg>
