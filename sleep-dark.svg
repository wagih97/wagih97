    <ellipse class="fur" cx="155" cy="133" rx="17" ry="13.5" transform="rotate(28 155 133)"/>
    <ellipse class="fur" cx="146" cy="113" rx="9.5" ry="11" transform="rotate(12 146 113)"/>
    <ellipse class="pink" cx="146.5" cy="114" rx="5.4" ry="7" transform="rotate(12 146.5 114)"/>
    <path d="M152.5 129Q156.5 132.5 161 130.5" fill="none" stroke="#a3acbd" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse class="pink" cx="168.6" cy="141.6" rx="2.7" ry="2.3"/>
